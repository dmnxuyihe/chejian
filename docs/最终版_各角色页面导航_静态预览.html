<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{--ink:#172037;--muted:#73809b;--line:#e7ebf5;--light:#f6f8fd;--indigo:#5d62f2;--violet:#8753ed;--surface:#fff;--shadow:0 8px 34px rgba(35,45,95,.045)}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f7f9fe;font-size:14px}
button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #a5b4fc;outline-offset:2px}
.app{display:grid;grid-template-columns:277px minmax(0,1fr);min-height:100vh}.sidebar{background:#fff;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{height:83px;padding:17px 19px;display:flex;align-items:center;gap:13px;border-bottom:1px solid var(--line)}.logo{width:41px;height:41px;border-radius:13px;background:linear-gradient(135deg,#6570f8,#a255f2);display:grid;place-items:center;box-shadow:0 8px 18px #665df83d;color:white;font-size:22px;font-weight:800}.brand b{font-size:17px;letter-spacing:.1px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.8px;margin-top:3px}
.rolepicker{padding:19px 16px 16px}.eyebrow{font-size:11px;color:#8b94ab;font-weight:700;letter-spacing:.6px}.rolepicker select{width:100%;margin-top:11px;border-radius:12px;background:#f6f7fd;border:1px solid #e2e5f4;padding:11px 10px;font-weight:650;color:#2c3652}.role-count{margin:10px 3px 0;color:var(--muted);font-size:12px}
.nav{padding:4px 11px 25px;flex:1}.nav-title{padding:9px 11px 13px;font-size:11px;font-weight:700;color:#9aa4b8;letter-spacing:1px}.group{margin-bottom:8px}.group-btn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:9px;background:transparent;border:0;border-radius:12px;padding:12px 12px;color:#54617e;font-weight:650;text-align:left}.group-btn:hover{background:#f5f6fc}.group-btn.active{color:#5c60da;background:#eeeefe}.group-btn .left{display:flex;align-items:center;gap:10px}.group-icon{width:29px;height:29px;border-radius:9px;background:#f1f2ff;color:#625fe4;display:grid;place-items:center;font-size:13px}.count{color:#9ba6bc;font-size:11px}.leafs{margin:2px 0 0 19px;padding-left:14px;border-left:1px solid #e8e9f8}.leaf{display:block;text-align:left;width:100%;border:0;background:transparent;padding:9px 10px;border-radius:9px;color:#788399;font-size:12px;line-height:1.45}.leaf:hover{color:#5962d5;background:#f7f6ff}.leaf.active{color:#575beb;background:#f0efff;font-weight:650}
.foot{padding:18px;border-top:1px solid var(--line);font-size:11px;color:#8c98ac;line-height:1.8}.foot strong{color:#54627f}
.main{min-width:0}.top{height:83px;display:flex;justify-content:space-between;align-items:center;padding:0 33px;background:#ffffffbf;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}.top .crumb{font-size:13px;color:#94a0b5}.top .crumb strong{color:#353e56}.preview-label{padding:8px 12px;border:1px solid #dfe3f6;border-radius:20px;color:#5b60df;background:#f1f2ff;font-size:11px;font-weight:700}.main-inner{max-width:1330px;padding:30px 34px 80px;margin:auto}
.titleline{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:23px}.titleline h1{font-size:29px;letter-spacing:-.6px;margin:8px 0}.desc{color:#71809a;font-size:13px;line-height:1.8;margin:0}.minor{font-size:11px;color:#8290a8}.pill{display:inline-flex;border-radius:7px;font-size:11px;padding:5px 8px;background:#eef0ff;color:#6e67ef;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:23px 0}.stat{background:#fff;border:1px solid #edf0f7;border-radius:16px;padding:19px;box-shadow:var(--shadow)}.stat-label{color:#8290aa;font-size:12px}.stat b{display:block;font-size:29px;margin:8px 0 0;color:#313b55}.stat:nth-child(2) b{color:#6860e7}
.card{background:#fff;border:1px solid #eceef7;border-radius:19px;padding:24px;box-shadow:var(--shadow);margin:0 0 18px}.card h2{margin:0 0 8px;font-size:17px}.hint{color:#8b96a9;font-size:12px;margin:0 0 20px;line-height:1.75}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.tile{background:#fbfcff;border:1px solid #eaeef7;border-radius:15px;padding:16px;text-align:left;transition:all .2s}.tile:hover{transform:translateY(-2px);border-color:#b5b8ff;box-shadow:0 11px 22px #5456d810}.tile h3{margin:6px 0 10px;font-size:14px;font-weight:750}.tile p{font-size:11px;line-height:1.6;color:#8190a5;margin:0}.circle{width:33px;height:33px;border-radius:11px;background:#eeeeff;color:#7367ec;display:grid;place-items:center;font-weight:750}.tile-foot{margin-top:16px;font-size:12px;color:#7775cf}
.path{display:flex;align-items:center;gap:9px;font-size:12px;color:#78849b;margin-bottom:17px}.sep{color:#c0c8d7}.datalist{border:1px solid #e9edf7;border-radius:14px;overflow:hidden}.item{padding:15px 16px;display:flex;justify-content:space-between;align-items:center;gap:15px;border-top:1px solid #edf0f6}.item:first-child{border-top:0}.item strong{font-size:13px}.item .meta{font-size:11px;color:#8896a9;margin-top:5px}.tag{color:#675fd9;background:#f1f0ff;border-radius:7px;padding:5px 9px;font-size:11px;white-space:nowrap}

<div class="app"><aside class="sidebar"><div class="brand"><div class="logo">✦</div><div><b>高级修 · 系统规划</b><small>MES PRO · ROLE NAVIGATION</small></div></div><div class="rolepicker"><div class="eyebrow">当前查看的人员角色</div><select id="role" aria-label="切换人员角色"></select><div id="roleCount" class="role-count"></div></div><nav class="nav"><div class="nav-title">业务模块 / 导航</div><div id="nav"></div></nav><div class="foot"><strong>最终版页面导航原型</strong><br>仅用于确认功能放在哪类人员页面。<br>不包含业务处理，不变更流程和数据库。</div></aside><div class="main"><header class="top"><div class="crumb">高级修车间 / <strong id="crumbRole">角色导航</strong></div><span class="preview-label">需求映射 · 212 / 212</span></header><div class="main-inner"><div class="titleline"><div><span class="pill">最终版 · 页面规划</span><h1 id="pageTitle">角色功能总览</h1><p class="desc" id="pageDesc">通过左侧菜单查看各角色的一级功能区和二级页面。</p></div></div><div class="stats" id="stats"></div><section class="card"><h2 id="detailTitle">一级功能区</h2><p class="hint" id="detailHint">每一个大块对应一个侧边栏导航分组，点击进入后查看二级页面。</p><div id="content"></div></section><div class="notice">说明：这是按《高级修检修车间信息化需求》逐条分配得到的页面导航，不是当前程序的完成情况。需求条目和原文以原 Excel 为准；功能间跨角色流转按原需求执行。</div></div></div></div>

人员":{"领料与需求计划":{"领料审核处理与查询":[111,112,113,114],"需求计划录入、跟踪及查询":[115,117,118]},"必换件与配送":{"预检录入与必换件配送":[119,122,123],"物料备料管理":[125]},"仓储出入与调拨":{"出入库及单据查询":[126,127,128,129],"物资调出/调入及单据":[130,131,132,133],"退库、盘点与盈亏处理":[134,135,136,137,138,139]},"库存与预警":{"库存与单品查询":[140,141,142],"库存/保质期预警及高低储":[143,144,145]},"物资系统对接":{"物资目录与基础信息同步":[146,149],"需求采购与订单合同同步":[147,151,152],"库存与出库结算同步":[148,150]},"仓储基础配置":{"仓库货位、分类和供应商配置":[155]}},"工具管理员":{"工具基础资料":{"工具字典与工具台账":[156,157],"工量具台账与定检提醒":[211]},"工具流转":{"工具借还与调拨":[158,159]},"工具生命周期":{"送检、送修与报废":[160,161,162]},"工具盘点与预警":{"盘点与综合预警":[163,164]},"智能工具设施":{"智能工具柜":[165],"无人工具室":[166]}},"设备管理员":{"设备资产":{"设备台账管理":[208]},"设备维护":{"设备故障报修及跟踪":[210]},"设备实时监控":{"设备运行状态监控":[212],"设备电子看板":[213]}},"安全管理人员":{"安全监控总览":{"异常行为识别与事件预警":[167]},"人员作业安全":{"安全帽检测":[168],"吊装危险区域监测":[169],"动火灭火器检测":[170],"禁烟识别":[171],"登高安全带检测":[172]}},"售后服务人员":{"售后服务组织":{"质保范围与售后计划":[77,78],"售后质量信息台账":[79]},"售后人员与配件":{"售后人员管理":[80],"售后配件借用及赔付":[81,83]},"服务回访":{"满意度调查与回访":[82]}},"车间管理人员":{"生产进度监控":{"机车与配件进度":[29,30],"视频监控":[31]},"停时分析":{"整车与工序停时分析":[32,33],"配件停时分析":[34]},"成本分析":{"单车成本分析":[153],"库存成本分析":[154]},"数字化驾驶舱":{"数字孪生产线电子看板":[180],"计划执行统计分析":[190]}},"系统管理员":{"组织与人员":{"组织机构管理":[175],"人员档案与画像":[176,179]},"用户与认证":{"统一用户管理及账号管理":[173,177],"统一身份认证":[174]},"权限管理":{"角色与权限配置":[178]}}}</script>
<script>
const DATA=JSON.parse(document.getElementById('navData').textContent);
const $=id=>document.getElementById(id);
let currentRole=Object.keys(DATA)[0],currentGroup=null,currentPage=null;
const escapeHTML=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const groupsFor=()=>DATA[currentRole];
const needCount=x=>Object.values(x).reduce((s,p)=>s+Object.values(p).flat().length,0);
function render(){
  $('crumbRole').textContent=currentRole;$('role').value=currentRole;
  const groups=groupsFor(), allPages=Object.values(groups).reduce((s,g)=>s+Object.keys(g).length,0), items=needCount(groups);
  $('roleCount').textContent=`${Object.keys(groups).length} 个功能区 · ${allPages} 个二级页面`;
  $('stats').innerHTML=`<div class="stat"><span class="stat-label">当前角色需求条数</span><b>${items}</b></div><div class="stat"><span class="stat-label">一级功能区</span><b>${Object.keys(groups).length}</b></div><div class="stat"><span class="stat-label">二级页面</span><b>${allPages}</b></div><div class="stat"><span class="stat-label">全部覆盖</span><b style="color:#11a57d">100%</b></div>`;
  $('nav').innerHTML=Object.entries(groups).map(([group,pages],index)=>{
    const open=currentGroup===group;
    return `<section class="group"><button class="group-btn ${open?'active':''}" data-group="${escapeHTML(group)}"><span class="left"><span class="group-icon">${['▤','▦','◈','◉','▣'][index%5]}</span>${escapeHTML(group)}</span><span class="count">${Object.keys(pages).length} ▾</span></button>${open?`<div class="leafs">${Object.keys(pages).map(page=>`<button class="leaf ${page===currentPage?'active':''}" data-page="${escapeHTML(page)}">${escapeHTML(page)}</button>`).join('')}</div>`:''}</section>`}).join('');
  $('nav').querySelectorAll('[data-group]').forEach(el=>el.addEventListener('click',()=>{const v=el.dataset.group;currentGroup=currentGroup===v?null:v;currentPage=null;render()}));
  $('nav').querySelectorAll('[data-page]').forEach(el=>el.addEventListener('click',()=>{currentPage=el.dataset.page;render()}));
  if(!currentGroup){
    $('pageTitle').textContent=`${currentRole} · 导航总览`;
    $('pageDesc').textContent='按照该角色负责的需求，整合为一级功能区和二级页面。';
    $('detailTitle').textContent='一级功能区';$('detailHint').textContent='点击下方功能卡或左侧菜单查看这个功能区包含哪些页面。';
    $('content').innerHTML=`<div class="grid">${Object.entries(groups).map(([g,p])=>`<button class="tile" data-card="${escapeHTML(g)}"><span class="circle">▤</span><h3>${escapeHTML(g)}</h3><p>${Object.keys(p).slice(0,3).map(escapeHTML).join(' · ')}${Object.keys(p).length>3?' ...':''}</p><div class="tile-foot">${Object.keys(p).length} 个页面 →</div></button>`).join('')}</div>`;
    $('content').querySelectorAll('[data-card]').forEach(el=>el.addEventListener('click',()=>{currentGroup=el.dataset.card;render()}));
  }else if(!currentPage){
    const pages=groups[currentGroup];
    $('pageTitle').textContent=currentGroup;
    $('pageDesc').textContent=`${currentRole} / ${Object.keys(pages).length}个二级页面`;
    $('detailTitle').textContent='二级页面规划';$('detailHint').textContent='每个页面可以承载多项原始需求，不必每条需求单独建一个页面。';
    $('content').innerHTML=`<div class="datalist">${Object.entries(pages).map(([p,rs])=>`<div class="item"><div><strong>${escapeHTML(p)}</strong><div class="meta">对应原需求行号：${rs.join('、')}</div></div><button class="tag" data-open="${escapeHTML(p)}">查看归属 ›</button></div>`).join('')}</div>`;
    $('content').querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>{currentPage=el.dataset.open;render()}));
  }else{
    const numbers=groups[currentGroup][currentPage];
    $('pageTitle').textContent=currentPage;$('pageDesc').textContent=`${currentRole} / ${currentGroup} / 二级页面规划`;
    $('detailTitle').textContent='需求归属';$('detailHint').textContent='当前页面应承载的原需求行号。这里不代表功能已经开发完成。';
    $('content').innerHTML=`<div class="path"><span>${escapeHTML(currentRole)}</span><span class="sep">/</span><span>${escapeHTML(currentGroup)}</span><span class="sep">/</span><b>${escapeHTML(currentPage)}</b></div><div class="mapping">${numbers.map(n=>`<div class="maprow"><strong>需求表第 ${n} 行</strong><span>原文请对照《高级修检修车间信息化需求》Excel文件查看</span></div>`).join('')}</div>`;
  }
}
$('role').innerHTML=Object.keys(DATA).map(r=>`<option value="${escapeHTML(r)}">${escapeHTML(r)}</option>`).join('');
$('role').addEventListener('change',e=>{currentRole=e.target.value;currentGroup=null;currentPage=null;render()});
render();
</script></body></html>
